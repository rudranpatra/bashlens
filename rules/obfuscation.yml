id: obfuscation
class: obfuscation
severity: high
description: Contains obfuscated or dynamic execution primitives
tree_sitter_query: null
regex:
  - "\\beval\\b"
  - "base64\\s+(?:-d|--decode)"
  - "\\bxxd\\s+-r\\b"
  - "(curl|wget)\\b[^\\n]*\\|\\s*(sh|bash)\\b"
  - "\\bbash\\s+<\\(\\s*(curl|wget)\\b"
  - "eval\\s+\"?\\$\\(\\s*(curl|wget)\\b"
