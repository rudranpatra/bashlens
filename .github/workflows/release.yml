name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux targets build inside `cross`'s Docker images, which ship a
      # correct musl toolchain for each arch. A first attempt here used
      # `gcc-aarch64-linux-gnu` (a glibc cross-gcc) as the linker for the
      # *musl* target - a real mismatch that failed the first tagged
      # release build. `cross` avoids re-guessing this by hand.
      - name: Install cross
        if: contains(matrix.target, 'linux')
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (Linux, via cross)
        if: contains(matrix.target, 'linux')
        run: cross build --release --target ${{ matrix.target }} -p bashlens

      - name: Build (macOS, native)
        if: contains(matrix.target, 'darwin')
        run: cargo build --release --target ${{ matrix.target }} -p bashlens

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf bashlens-${{ matrix.target }}.tar.gz bashlens
          cd -
          mkdir -p dist
          mv target/${{ matrix.target }}/release/bashlens-${{ matrix.target }}.tar.gz dist/

      - uses: actions/upload-artifact@v4
        with:
          name: bashlens-${{ matrix.target }}
          path: dist/*.tar.gz

  checksums-and-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
          generate_release_notes: true
